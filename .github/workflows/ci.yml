name: ci

# Every PR runs the test suite with the race detector before merge.
on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repo; the token gets nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -race -timeout 10m ./...
